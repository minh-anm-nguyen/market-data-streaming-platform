# Project 04 what-if verdict matrix.
#
# GENERATED by tools/build_verdict_matrix.py from section 9 of the design
# document. Case ids, priorities and stimuli are parsed from the document, so
# this file cannot silently omit a case or drift from the text it tracks.
#
# Status vocabulary, and what each one is allowed to mean:
#
#   PASS             the case oracle was satisfied: the stimulus was applied,
#                    an independent oracle checked it, an artifact exists
#   PASS_MODEL_ONLY  the stimulus was applied to the in-process fake transport
#                    and the assertion held, but this case oracle calls for a
#                    real broker. This is NOT a pass for the case; it is
#                    recorded separately so the gap stays visible
#   FAIL             the stimulus was applied and the behaviour was wrong
#   INCOMPLETE       the run could not finish, or completeness is unprovable
#   INCONCLUSIVE     the stimulus could not be demonstrably applied
#   NOT_RUN          not attempted
#   BLOCKED          cannot be attempted in this lab, with the reason stated
#
# Section 14 rule: no case may be marked PASS because nothing crashed.

