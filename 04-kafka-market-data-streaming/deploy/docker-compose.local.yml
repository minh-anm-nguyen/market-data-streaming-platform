# Profile local-dev: one Kafka KRaft broker, RF=1, minISR=1 (section 4.5).
#
# This profile exists to learn the protocol and to run the integration suite.
# It must never support an HA or failover claim: with one broker there is no
# second replica to fail over to, and section 2.2 is explicit that a single
# broker is not HA no matter how healthy it looks.
#
# The image is pinned by tag here and the run report records what the live
# cluster reported, because NFR-14 wants the version that actually ran, not the
# one the file asked for.
services:
  kafka:
    image: apache/kafka:4.2.0
    container_name: p04-kafka-local
    # Loopback only. Section 6.1: a lab broker must not be reachable from the
    # network, and binding to 127.0.0.1 is the one line that guarantees it
    # regardless of host firewall state.
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client listeners on purpose. PLAINTEXT is the direct path used by
      # the normal integration runs. PROXY exists so Toxiproxy can sit in front
      # of it, and it is advertised as the proxy address rather than the
      # broker address: a client that bootstraps through the proxy and then
      # receives direct-path metadata would reconnect around the proxy and the
      # injected fault would never be exercised. Getting this wrong produces a
      # network-fault test that silently tests nothing.
      KAFKA_LISTENERS: PLAINTEXT://:9092,PROXY://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,PROXY://127.0.0.1:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PROXY:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # FR-13: provisioning goes through the Admin path. Auto-creation would
      # silently create a 1-partition topic and defeat the partition-count
      # contract that per-key ordering depends on.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Default topic settings. The publisher verifies the real values through
      # DescribeConfigs anyway; these only make the defaults honest.
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      CLUSTER_ID: p04LocalDevClusterAA
    healthcheck:
      # The broker answering an ApiVersions request is the earliest point at
      # which a client can usefully connect. A port check would pass before the
      # broker is ready and turn startup races into flaky tests.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  # Toxiproxy sits between the publisher and the broker for the network fault
  # cases (E2E-08, G-*). It starts with the stack but idle: a test creates its
  # proxy and toxics through the HTTP API, so the fault plan lives in the test
  # rather than in this file.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: p04-toxiproxy
    ports:
      - "127.0.0.1:8474:8474"   # control API
      - "127.0.0.1:19092:19092" # proxied broker listener
    command: ["-host", "0.0.0.0"]
    depends_on:
      kafka:
        condition: service_healthy
