# Test configuration lives at the PROJECT root, not under python/.
#
# pytest derives rootdir from the arguments it is given, then resolves
# `pythonpath` against that rootdir. With the config nested under python/, a run
# invoked as `pytest tests/...` picks a different rootdir and the package is not
# importable. Keeping it here means `pytest` works from one place regardless of
# which subset of tests is named.
[pytest]
testpaths = tests
pythonpath = python/src
markers =
    cases(*ids): what-if matrix case ids this test provides evidence for
    cpp: needs the C++ tools built in build/cpp
    slow: takes more than a few seconds
    perf: a throughput or latency measurement, not a correctness assertion
    soak: long-running resource-growth test
    fuzz: randomised input; reports its seed on failure
filterwarnings =
    error::DeprecationWarning
    # pytest-asyncio is present in the shared venv for Project 01; this project
    # has no async tests, so its unset-option notice is not actionable here.
    ignore::pytest.PytestDeprecationWarning
asyncio_default_fixture_loop_scope = function
