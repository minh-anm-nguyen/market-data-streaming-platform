# P09 M11/M12: the RELIABILITY-LAB and CAPACITY-LAB profiles.
#
# Separate from compose.dev.yaml, on different ports and different volumes, for
# a reason that is not tidiness: the DEV stack holds the dataset the pipeline
# just proved, and a lab that fails over brokers or fills a disk must not be
# able to touch it. Nothing here shares a volume name with DEV.
#
# Start one profile at a time:
#   docker compose -f compose.labs.yaml --profile reliability up -d
#   docker compose -f compose.labs.yaml --profile capacity    up -d
#
# ----------------------------------------------------------------------------
# WHAT THESE PROFILES CANNOT PROVE ON THIS HOST
# ----------------------------------------------------------------------------
# Read this before running anything, and before quoting any number from it.
#
# 1. Three brokers on one host is not HA. They share a kernel, a disk and a
#    network namespace. Killing one proves leader election and ISR behaviour,
#    which is worth proving; killing the host proves nothing was survivable.
#    P09 section 2.2 is explicit, and this file does not soften it.
#
# 2. This Docker daemon is shared with an unrelated, crash-looping stack. Six
#    broker-risk:py312 containers restart continuously here, and an exited
#    br-kafka (Kafka 3.9.0) and mdp-clickhouse (24.8) previously published the
#    same ports the DEV profile uses. That contention has already been observed
#    to make published ports refuse connections intermittently. Any latency or
#    throughput figure measured on this host is therefore uninterpretable, and
#    the capacity profile exists to be *runnable*, not to be believed. Move to
#    an isolated daemon before measuring.
#
# 3. RF=3 with minISR=2 is a durability setting, not durability. It becomes a
#    claim only once a failure has been injected and an independent oracle has
#    reconciled the result afterwards. That is P07's job, and gate G4 stays
#    NOT_RUN until it has run against this topology.
#
# Ports are offset from DEV deliberately (19xxx, 29xxx, 18xxx, 28xxx) so a lab
# can run beside the DEV stack without either stealing the other's listener.

name: p09-labs

x-kafka-health: &kafka-health
  test:
    - CMD-SHELL
    - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
  interval: 5s
  timeout: 10s
  retries: 30
  start_period: 20s

x-rel-kafka-env: &rel-kafka-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # The controller quorum spans all three nodes, so losing one leaves a
  # majority. With a two-node quorum a single loss would stop the cluster and
  # the failover test would be measuring the wrong thing.
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@rel-kafka-1:9093,2@rel-kafka-2:9093,3@rel-kafka-3:9093"
  CLUSTER_ID: p09RelClusterAAAA
  # RF=3 / minISR=2: a write needs two replicas, so one broker may be lost
  # without losing writes, and a second loss stops writes rather than accepting
  # them unsafely.
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  # Never enabled: it trades a known stop for silent data loss, which is the one
  # thing this whole platform is organised against.
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_NUM_PARTITIONS: "8"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_LOG_DIRS: /var/lib/kafka/data

x-ch-health: &ch-health
  # Both protocols, as in DEV: an HTTP-only probe passes while the native port
  # is dead, which this lab already learned the hard way.
  test:
    - CMD-SHELL
    - >-
      wget --spider -q http://127.0.0.1:8123/ping &&
      clickhouse-client --host 127.0.0.1 --port 9000 --query 'SELECT 1' >/dev/null
  interval: 3s
  timeout: 5s
  retries: 20
  start_period: 10s

x-ch-env: &ch-env
  CLICKHOUSE_DB: default
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: ""
  TZ: UTC

services:
  # --------------------------------------------------------------------------
  # RELIABILITY-LAB: 3 brokers, RF=3, minISR=2. Failover and ISR behaviour.
  # --------------------------------------------------------------------------
  rel-kafka-1:
    image: apache/kafka:4.2.0@sha256:9516fb7634bad307d17c33b589fde9023003b0cb761374f500002b980a3149b9
    container_name: p09-rel-kafka-1
    profiles: [reliability]
    ports:
      - "127.0.0.1:19092:9092"
    environment:
      <<: *rel-kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19092,INTERNAL://rel-kafka-1:9094
    volumes:
      - rel-kafka-1:/var/lib/kafka/data
    healthcheck: *kafka-health

  rel-kafka-2:
    image: apache/kafka:4.2.0@sha256:9516fb7634bad307d17c33b589fde9023003b0cb761374f500002b980a3149b9
    container_name: p09-rel-kafka-2
    profiles: [reliability]
    ports:
      - "127.0.0.1:19093:9092"
    environment:
      <<: *rel-kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19093,INTERNAL://rel-kafka-2:9094
    volumes:
      - rel-kafka-2:/var/lib/kafka/data
    healthcheck: *kafka-health

  rel-kafka-3:
    image: apache/kafka:4.2.0@sha256:9516fb7634bad307d17c33b589fde9023003b0cb761374f500002b980a3149b9
    container_name: p09-rel-kafka-3
    profiles: [reliability]
    ports:
      - "127.0.0.1:19094:9092"
    environment:
      <<: *rel-kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19094,INTERNAL://rel-kafka-3:9094
    volumes:
      - rel-kafka-3:/var/lib/kafka/data
    healthcheck: *kafka-health

  rel-clickhouse:
    image: clickhouse/clickhouse-server:25.3.3.42@sha256:cc6b7488017512db99bff97c493030152bb786249afdfec8b6714eaf16a6f4ae
    container_name: p09-rel-clickhouse
    profiles: [reliability]
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment: *ch-env
    ports:
      - "127.0.0.1:18123:8123"
      - "127.0.0.1:19000:9000"
    volumes:
      - rel-clickhouse:/var/lib/clickhouse
      - ../../06-clickhouse-analytics/config/clickhouse-overrides.xml:/etc/clickhouse-server/config.d/p06.xml:ro
      - ./clickhouse/zz-p09-listen.xml:/etc/clickhouse-server/config.d/zz-p09-listen.xml:ro
    healthcheck: *ch-health

  # --------------------------------------------------------------------------
  # CAPACITY-LAB: one broker, 8 partitions per topic, larger budgets, for the
  # load ladder P08 drives. One broker on purpose: a capacity number and a
  # durability claim are different measurements, and mixing them produces a
  # figure that supports neither.
  # --------------------------------------------------------------------------
  cap-kafka:
    image: apache/kafka:4.2.0@sha256:9516fb7634bad307d17c33b589fde9023003b0cb761374f500002b980a3149b9
    container_name: p09-cap-kafka
    profiles: [capacity]
    ports:
      - "127.0.0.1:29092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "8"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: p09CapClusterAAAA
      # Larger than DEV because the load ladder is the point. Starting values to
      # be re-pinned per host and recorded in the P08 report, not tuning advice.
      KAFKA_NUM_NETWORK_THREADS: "8"
      KAFKA_NUM_IO_THREADS: "16"
      KAFKA_LOG_RETENTION_HOURS: "72"
    volumes:
      - cap-kafka:/var/lib/kafka/data
    healthcheck: *kafka-health

  cap-clickhouse:
    image: clickhouse/clickhouse-server:25.3.3.42@sha256:cc6b7488017512db99bff97c493030152bb786249afdfec8b6714eaf16a6f4ae
    container_name: p09-cap-clickhouse
    profiles: [capacity]
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment: *ch-env
    ports:
      - "127.0.0.1:28123:8123"
      - "127.0.0.1:29000:9000"
    volumes:
      - cap-clickhouse:/var/lib/clickhouse
      - ../../06-clickhouse-analytics/config/clickhouse-overrides.xml:/etc/clickhouse-server/config.d/p06.xml:ro
      - ./clickhouse/zz-p09-listen.xml:/etc/clickhouse-server/config.d/zz-p09-listen.xml:ro
    healthcheck: *ch-health

volumes:
  # Named apart from the DEV volumes on purpose. A chaos run that destroys a
  # volume must not be able to name the one holding the dataset the pipeline
  # proved (P09 FR-18).
  rel-kafka-1:
    name: p09-rel-kafka-1
  rel-kafka-2:
    name: p09-rel-kafka-2
  rel-kafka-3:
    name: p09-rel-kafka-3
  rel-clickhouse:
    name: p09-rel-clickhouse
  cap-kafka:
    name: p09-cap-kafka
  cap-clickhouse:
    name: p09-cap-clickhouse

networks:
  default:
    name: p09-labs
