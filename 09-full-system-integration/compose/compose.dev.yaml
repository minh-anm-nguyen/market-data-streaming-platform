# P09 DEV profile: one Kafka KRaft broker, one ClickHouse node, one host.
#
# What this profile is for: schema and contract work, end-to-end correctness on
# a finite dataset, restart and persistence behaviour, and learning the stack.
#
# What it CANNOT support, however healthy every container looks (P09 s.2.2):
#   - HA or failover. One broker has no second replica; one ClickHouse node has
#     no replica. RF=1 is not durability.
#   - 120k ticks/s or a 280 ms p95. Those belong to CAPACITY-LAB, on isolated
#     storage and compute, measured by P08.
#   - any claim about data correctness. `service_healthy` means a healthcheck
#     answered. It says nothing about whether the right rows arrived, which is
#     why P07's oracle is a separate plane and a separate gate (G3 vs G2).
#
# Two deliberate differences from the per-project compose files this replaces:
#
#   1. Kafka gets a NAMED VOLUME. 04-*/deploy/docker-compose.local.yml runs the
#      broker with no volume at all, so every `down` silently discards the log
#      and an offset-retention test cannot mean anything. P09 FR-06 requires
#      state on named volumes that survive a service restart.
#   2. Both services share one network and one lifecycle, so the ordering
#      between them is declared rather than left to whoever types first.
#
# Image tags are pinned to the exact versions the projects were proven against.
# Section 3 wants digests in the release manifest; a tag is weaker than a digest
# and `p09 preflight` says so rather than pretending otherwise.

name: p09-dev

services:
  kafka:
    # Tag AND digest. The tag stays for a human reader; the digest is what
    # Docker actually resolves, so a repushed tag cannot change the bytes under
    # a release that was already recorded. G0 cannot pass on a tag alone
    # (`p09 preflight`), which is the whole reason this is here.
    image: apache/kafka:4.2.0@sha256:9516fb7634bad307d17c33b589fde9023003b0cb761374f500002b980a3149b9
    container_name: p09-dev-kafka
    # Loopback only. A lab broker must not be reachable from the network, and
    # binding 127.0.0.1 guarantees that regardless of host firewall state.
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # TWO client listeners, because this platform has two kinds of client and
      # one advertised address cannot serve both.
      #
      # A Kafka client bootstraps, receives the ADVERTISED address, and then
      # reconnects to that. So the advertised value must be reachable from the
      # client, not from the broker:
      #
      #   PLAINTEXT 127.0.0.1:9092  the P03 and P04 binaries, which are native
      #                             WSL processes reaching the published port.
      #   INTERNAL  kafka:9094      the python-tools container (P05/P06/P07/P08),
      #                             which resolves the service name on this
      #                             network and cannot reach the host loopback.
      #
      # With only the host listener, an in-network client connects once and is
      # then told to go to 127.0.0.1:9092, which inside its own namespace is
      # itself. That failure looks like a dead broker and is not.
      #
      # The host listener keeps the name PLAINTEXT, and inter-broker traffic
      # stays on it, because that is the exact shape P04's own lab proved its
      # librdkafka 2.6.1 against (its E2E-01, 20000 events). Renaming it to HOST
      # was tried here and P04 could not complete an ApiVersions exchange, so
      # the deviation is not worth the tidier name.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,INTERNAL://kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # P09 FR-03: provisioning goes through the Admin path only. Auto-creation
      # would make a 1-partition topic on first produce and quietly break the
      # per-key ordering contract that every downstream proof depends on.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "8"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "24"
      # The cluster id is fixed so a restart against the same volume is a
      # restart and not a new cluster wearing the old data (runbook RB-02).
      CLUSTER_ID: p09DevClusterAAAA
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # The broker answering ApiVersions is the earliest point a client can
      # usefully connect. A port check passes before the broker is ready and
      # turns startup races into flaky tests.
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  clickhouse:
    # Tag and digest, for the same reason as the broker above. P06's own notes
    # record that insert de-duplication and dependent materialized-view
    # behaviour have changed between ClickHouse releases, so "whatever that tag
    # points at today" is not a reproducible dependency.
    image: clickhouse/clickhouse-server:25.3.3.42@sha256:cc6b7488017512db99bff97c493030152bb786249afdfec8b6714eaf16a6f4ae
    container_name: p09-dev-clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      # A local lab with no exposed credentials. Do not copy this anywhere real;
      # P09 NFR-09 wants zero credentials in logs, images or artifacts, which an
      # empty default password satisfies only because nothing can reach it.
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      # The host may be in a local zone; the server must not be, so a timezone
      # bug surfaces in the tests rather than in the bars (P06 case D-04).
      TZ: UTC
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # query_log must be on, or the diagnostics return nothing and an empty
      # query_log gets mistaken for an absence of slow queries. P06 owns this
      # file; it is mounted, never copied, so there is one source of truth.
      - ../../06-clickhouse-analytics/config/clickhouse-overrides.xml:/etc/clickhouse-server/config.d/p06.xml:ro
      # Pins the listeners to IPv4. Read clickhouse/zz-p09-listen.xml for why:
      # without it the native port silently fails to bind on an IPv6-disabled
      # kernel and the container still reports healthy.
      - ./clickhouse/zz-p09-listen.xml:/etc/clickhouse-server/config.d/zz-p09-listen.xml:ro
    healthcheck:
      # BOTH protocols, deliberately. The image's own probe checks HTTP /ping
      # only, which passes while the native port on 9000 refuses connections:
      # every clickhouse-client caller then fails against a "healthy" container.
      # A healthcheck that cannot observe a failure mode is not a check.
      test:
        - CMD-SHELL
        - >-
          wget --spider -q http://127.0.0.1:8123/ping &&
          clickhouse-client --host 127.0.0.1 --port 9000 --query 'SELECT 1' >/dev/null
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  # Named, and named explicitly, so `p09 preflight` can tell a lab volume from
  # whatever else is on the host before anything destructive is offered.
  kafka-data:
    name: p09-dev-kafka-data
  clickhouse-data:
    name: p09-dev-clickhouse-data

networks:
  default:
    name: p09-dev
