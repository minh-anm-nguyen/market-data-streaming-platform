[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p09-integration"
version = "0.1.0"
description = "Full-system integration, deployment and release engineering for the market data platform"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
p09 = "p09_integration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "needs_docker: requires a reachable Docker daemon",
    "needs_wsl: requires WSL Ubuntu-22.04",
    "slow: takes more than a few seconds",
]
