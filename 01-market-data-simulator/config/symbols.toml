# A reference library of symbol definitions, for copying into a config file.
#
# NOTE: this file is NOT included automatically. The config parser has no
# include mechanism on purpose -- one file resolves to one config with one hash,
# which is what makes a run reproducible and auditable. Paste the blocks you
# want into your config's [symbols] section and list them in [symbols].order.
#
# A symbol name containing a dot MUST be quoted as a TOML key -- bare
# [US500.CFD] would parse as a nested table "CFD" inside "US500", not as a
# symbol called US500.CFD.
#
# All values are integer ticks. The displayed price is price_ticks / price_scale.
# These are SIMULATION parameters chosen for testing; they do not reproduce any
# particular broker's conventions, and the prices are synthetic.

# --- FX majors, 5-decimal convention (scale 100000) -------------------------

[EURUSD]
price_scale = 100000
initial_price_ticks = 108347      # displays as 1.08347
min_price_ticks = 100000
max_price_ticks = 120000
min_spread_ticks = 1
max_spread_ticks = 5
max_step_ticks = 8
weight = 3

