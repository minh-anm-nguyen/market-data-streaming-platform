[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-sim"
version = "0.1.0"
description = "Deterministic FX/CFD market data simulator (synthetic data, for testing only)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "psutil>=5.9"]

[project.scripts]
market-sim = "market_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: takes more than a few seconds",
    "perf: throughput or latency measurement, not a correctness assertion",
    "soak: long-running resource-growth test",
    "chaos: injects process, disk or network failure",
]
filterwarnings = ["error::DeprecationWarning"]
