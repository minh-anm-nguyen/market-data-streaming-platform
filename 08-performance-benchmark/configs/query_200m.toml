# QUERY_ONLY -- the pinned Q02 query family over a 200M unique tick build.
#
# Read-only against a SEALED snapshot: nothing is ingested, so the write rates
# below are the minimum the parser accepts rather than a workload. The p95
# budget of 280 ms is attached to this exact named workload (Q02, concurrency 4,
# warm cache, 200M verified unique canonical ticks) and to nothing else.
#
# 200M unique canonical ticks is not 200M physical raw rows, and FIX-004 gates
# apply before any of this runs.

[run]
id = "P08-L09-QUERY-200M"
seed = 20261030
manifest_version = "p08.v1"
profile = "QUERY_ONLY"
expected_oracle = "builtin-independent"
lane = "L09"

[dataset]
dataset_id = "BENCH_READY_200M"
schema = "marketdata.v1.MarketDataEvent"
symbol_count = 100
symbol_distribution = "uniform"
tick_to_quote_ratio = "4:1"
source_seal_required = true

[kafka]
tick_topic = "md.ticks.v1"
quote_topic = "md.quotes.v1"
partitions_per_topic = 8
producer_acks = "all"
producer_idempotent = true
# Issued by P09, not chosen here. The generation tag identifies a topic
# incarnation, and only the component that creates the topics knows when
# one was deleted and recreated. Read it from
# 09-full-system-integration/contracts/contracts.lock.yaml
# (cross_project_identity.kafka.topic_generation). P09 finding P09-M0-08.
topic_generation = "md-v1-generation-a"

[load]
model = "open_loop"
market_tick_target_per_s = 1
quote_target_per_s = 0
ramp_up_seconds = 0
warmup_seconds = 300
steady_seconds = 1800
drain_seconds = 0
max_late_issue_ms = 10

[query]
# The named Q02-280ms workload. Warm and cold are separate runs.
enabled = true
family = "Q02"
concurrency = 4
min_complete_samples = 10000
client_p95_budget_ms = 280
cache_profile = "warm"
deadline_ms = 5000

[evidence]
require_ready_snapshot = true
require_identity_diff = true
require_semantic_match = true
require_fault_receipt_if_chaos = true
fail_on_missing_metrics = true

[safety]
lab_only = true
dry_run_destructive_actions = true
max_test_volume_fill_percent = 90
allow_host_root_path = false
