# LOCAL_SMALL -- one broker, one ClickHouse node, learning the architecture.
#
# Every key is required: the parser rejects unknown AND missing keys, so a
# config file is always a complete, auditable statement of the run. One file,
# one resolved config, one digest, no include mechanism.
#
# Nothing here is a target this machine is known to reach. The rates are the
# smallest useful ones, chosen so a correctness lane finishes quickly; a
# capacity claim needs LAB_CAPACITY and the 1800-second steady protocol.

[run]
id = "P08-LOCAL-SMALL"
seed = 20261030
manifest_version = "p08.v1"
profile = "LOCAL_SMALL"
expected_oracle = "builtin-independent"
lane = "L01"

[dataset]
dataset_id = "BENCH_LOCAL_001"
schema = "marketdata.v1.MarketDataEvent"
symbol_count = 3
symbol_distribution = "uniform"
tick_to_quote_ratio = "4:1"
source_seal_required = true

[kafka]
tick_topic = "md.ticks.v1"
quote_topic = "md.quotes.v1"
partitions_per_topic = 8
producer_acks = "all"
producer_idempotent = true
# Issued by P09, not chosen here. The generation tag identifies a topic
# incarnation, and only the component that creates the topics knows when
# one was deleted and recreated. Read it from
# 09-full-system-integration/contracts/contracts.lock.yaml
# (cross_project_identity.kafka.topic_generation). P09 finding P09-M0-08.
topic_generation = "md-v1-generation-a"

[load]
model = "open_loop"
market_tick_target_per_s = 1000
quote_target_per_s = 250
ramp_up_seconds = 0
warmup_seconds = 10
steady_seconds = 60
drain_seconds = 15
max_late_issue_ms = 10

[query]
# Disabled: this lane proves correctness and accounting, not query latency.
enabled = false
family = "Q02"
concurrency = 1
min_complete_samples = 100
client_p95_budget_ms = 280
cache_profile = "warm"
deadline_ms = 2000

[evidence]
require_ready_snapshot = true
require_identity_diff = true
require_semantic_match = true
require_fault_receipt_if_chaos = true
fail_on_missing_metrics = true

[safety]
lab_only = true
dry_run_destructive_actions = true
max_test_volume_fill_percent = 90
allow_host_root_path = false
