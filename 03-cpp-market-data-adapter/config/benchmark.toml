# Benchmark configuration.
#
# Separate from config/example.toml on purpose: a benchmark run and a
# correctness run must not share a file, or a tuned budget quietly becomes
# the default everywhere.
#
# Two rules for anything measured with this file:
#   1. Report the lane. A decode-only number says nothing about live TCP
#      capacity, and a metrics_only number says nothing about sink
#      throughput.
#   2. A single run is not a sustainable rate. See docs/benchmarks.md.

[identity]
protocol = "MDP1"
proto_package = "marketdata.v1"
source_schema_version = "sim.v1"
expected_descriptor_sha256 = "UNPINNED"
allowed_symbols = ["EURUSD", "GBPUSD", "USDJPY"]
max_symbols = 256
max_datasets = 4
# Larger than the example: a benchmark should fail on a real cap, not on a
# budget chosen for a 3-symbol demo.
max_state_bytes = 268435456

[input]
mode = "pbstream"
file = "fixtures/normal/golden.pbstream"
require_completed_manifest = true
host = "127.0.0.1"
port = 9010
max_payload_bytes = 4096
read_chunk_bytes = 65536
max_frames_per_iteration = 256
connect_deadline_ms = 3000
prefix_deadline_ms = 2000
header_partial_deadline_ms = 2000
body_deadline_ms = 2000
idle_timeout_ms = 0
allow_non_loopback = false

[validation]
mode = "strict_monitor"
fault_manifest = ""
max_dataset_id_bytes = 128
max_symbol_bytes = 32
max_source_version_bytes = 32
sequence_window = 4096
on_business_reject = "skip_with_reason"
on_malformed_frame = "fail_closed"
reject_unknown_fields = false

[prices.EURUSD]
price_scale = 100000
min_price_ticks = 1
max_price_ticks = 500000
min_spread_ticks = 0
max_spread_ticks = 200

[prices.GBPUSD]
price_scale = 100000
min_price_ticks = 1
max_price_ticks = 500000
min_spread_ticks = 0
max_spread_ticks = 200

[prices.USDJPY]
price_scale = 1000
min_price_ticks = 1
max_price_ticks = 500000
min_spread_ticks = 0
max_spread_ticks = 200

[freshness]
event_time_stale_threshold_ns = 2000000000
quote_inactivity_threshold_ms = 3000
timer_tick_ms = 100
clock_mode = "virtual_for_replay"

[output]
# metrics_only isolates the adapter's own cost. Switching to a file sink
# measures something different and must be reported as a different lane.
sink = "metrics_only"
max_queue_events = 4096
max_queue_bytes = 8388608
pause_read_high_watermark_pct = 80
resume_read_low_watermark_pct = 40
output_stall_deadline_ms = 5000
shutdown_drain_deadline_ms = 5000
file = "out/bench_events.ndjson"
stub_delay_us = 0

[reconnect]
initial_backoff_ms = 100
max_backoff_ms = 10000
max_attempts = 50
continue_dataset_within_process = true
jitter_seed = 0
jitter_pct = 20

[benchmark]
target_events_per_sec = [1000, 10000, 50000, 120000]
report_interval_ms = 1000
sample_processing_latency = true
